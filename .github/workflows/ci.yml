name: CI

on:
  push:
    branches: [main, "agent/**", "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Vesper's runtime target is Windows, so the suite runs there too. This validates
    # the Windows code paths (paths, process handling, startup registration) that a
    # Linux-only job cannot exercise. It is not hardware validation: no AMD telemetry,
    # no local model, and no audio device is involved.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Security checks
        run: npm run security

      - name: Repository hygiene
        run: npm run hygiene

      - name: Production check
        run: npm run build
